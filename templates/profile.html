<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libris Digital - Profile Settings</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

{% include 'navbar.html' %}

<!-- Main Container -->
<main class="main-content container-fluid px-4 py-4">
    <!-- Header -->
    <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
        <h2 class="fw-bold m-0 text-primary d-flex align-items-center gap-2">
            <span class="material-symbols-outlined fs-2">person</span> Account Settings
        </h2>
    </header>

    <!-- Alert Banners -->
    {% if success %}
    <div class="alert alert-success alert-dismissible fade show" role="alert">
        {{ success }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}
    {% if error %}
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
        {{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    <div class="row g-4">
        <!-- Profile Picture Upload Card -->
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h5 class="fw-bold mb-3">Profile Avatar</h5>
                <img src="/static/uploads/{{ session.get('profile_image', 'default_profile.png') }}" class="rounded-circle border mb-3 mx-auto" width="120" height="120" alt="Profile avatar" style="object-fit: cover;">
                <p class="text-muted small">Update your system avatar. Allowed formats: PNG, JPG, JPEG.</p>
                <form action="/profile/avatar" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <input type="file" class="form-control" name="profile_image" required>
                    </div>
                    <button type="submit" class="btn btn-outline-primary w-100">Upload Image</button>
                </form>
            </div>
        </div>

        <!-- Personal Details & Security Form -->
        <div class="col-md-8">
            <div class="card p-4">
                <h5 class="fw-bold mb-4">Edit Profile Information</h5>
                <form action="/profile/update" method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="fullname" value="{{ user.fullname }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">User ID</label>
                            <input type="text" class="form-control" name="email" value="{{ user.email }}" required>
                        </div>
                    </div>
                    <hr class="my-4">
                    <h6 class="fw-bold text-danger mb-3">Change Account Password</h6>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" name="new_password" placeholder="Leave blank to keep existing password">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" name="confirm_new_password" placeholder="Leave blank to keep existing password">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary px-4 py-2 mt-3">Save Account Settings</button>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
