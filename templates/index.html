<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libris Digital - Log In</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">

<div class="card p-4 shadow-lg w-100" style="max-width: 400px; border-radius: 16px;">
    <div class="text-center mb-4">
        <span class="material-symbols-outlined text-primary fs-1">local_library</span>
        <h2 class="fw-bold mt-2 text-primary">Libris Digital</h2>
        <p class="text-muted">Digital Library Management System</p>
    </div>

    <!-- Alert Banners -->
    {% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>
    {% endif %}

    {% if registration_success %}
    <div class="alert alert-success" role="alert">
        Registration successful! Please login below.
    </div>
    {% endif %}

    {% if message %}
    <div class="alert alert-info" role="alert">
        {{ message }}
    </div>
    {% endif %}

    <form action="/login" method="POST">
        <div class="mb-3">
            <label for="email" class="form-label">User ID</label>
            <input type="text" class="form-control" id="email" name="email" required placeholder="Enter User ID">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
        </div>
        <div class="mb-3 form-check d-flex justify-content-between">
            <div>
                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                <label class="form-check-label text-muted small" for="remember">Remember me</label>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
    </form>

    <div class="text-center mt-4">
        <span class="text-muted small">Don't have an account?</span>
        <a href="/register" class="text-decoration-none small fw-semibold ms-1">Create Account</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
