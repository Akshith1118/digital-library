<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libris Digital - Register</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">

<div class="card p-4 shadow-lg w-100 my-4" style="max-width: 480px; border-radius: 16px;">
    <div class="text-center mb-4">
        <span class="material-symbols-outlined text-primary fs-1">local_library</span>
        <h2 class="fw-bold mt-2 text-primary">Join Libris Digital</h2>
        <p class="text-muted">Create an account to browse and borrow books</p>
    </div>

    <!-- Alert Banners -->
    {% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <form action="/register" method="POST" onsubmit="return validateRegisterForm()">
        <div class="mb-3">
            <label for="fullname" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="fullname" name="fullname" required placeholder="Enter full name">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">User ID</label>
            <input type="text" class="form-control" id="email" name="email" required placeholder="Create User ID">
        </div>
        <div class="mb-3">
            <label for="role" class="form-label">Select Role</label>
            <select class="form-select" id="role" name="role" required>
                <option value="" disabled selected>Choose your role...</option>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
            </select>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
            </div>
            <div class="col-md-6 mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="••••••••">
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">Create Account</button>
    </form>

    <div class="text-center mt-4">
        <span class="text-muted small">Already have an account?</span>
        <a href="/" class="text-decoration-none small fw-semibold ms-1">Sign In</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function validateRegisterForm() {
    const pwd = document.getElementById('password').value;
    const confirm = document.getElementById('confirm_password').value;
    if (pwd !== confirm) {
        alert("Passwords do not match!");
        return false;
    }
    if (pwd.length < 6) {
        alert("Password must be at least 6 characters long!");
        return false;
    }
    return true;
}
</script>
</body>
</html>
